<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>status.me</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='2' fill='%233294fc'/%3E%3Crect x='5' y='5' width='5' height='5' fill='%23fff'/%3E%3Crect x='12' y='5' width='5' height='5' fill='%23fff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --brand: #3294fc;
        --on-brand: #fff;
        --page: #fff;
        --focus: #1a1a1a;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--page);
        display: grid;
        place-items: center;
      }

      .face {
        font-family:
          'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
        font-size: clamp(4rem, 18vmin, 9rem);
        line-height: 1;
        user-select: none;
      }

      .mark {
        position: fixed;
        right: max(1.5rem, env(safe-area-inset-right));
        bottom: max(1.5rem, env(safe-area-inset-bottom));
        display: block;
        line-height: 0;
        border-radius: 4px;
        padding: 0.5rem;
        margin: -0.5rem;
      }

      /* Grey until you reach for it, so the page stays empty until it is wanted. */
      .mark svg {
        display: block;
        width: 30px;
        height: 30px;
        filter: grayscale(1);
        transition: filter 150ms ease;
      }

      .mark:hover svg,
      .mark:focus-visible svg {
        filter: none;
      }

      .mark:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .mark svg {
          transition-duration: 0.01ms;
        }
      }

      .square {
        fill: var(--brand);
      }

      .pixel {
        fill: var(--on-brand);
      }
    </style>
  </head>
  <body>
    <span class="face" role="img" aria-label="face with sunglasses">😎</span>

    <a class="mark" href="https://feedmypixel.com" aria-label="feedmypixel portfolio">
      <svg viewBox="0 0 30 30" aria-hidden="true" focusable="false">
        <rect class="square" width="30" height="30" rx="2" />
        <rect class="pixel" x="5" y="5" width="5" height="5" />
        <rect class="pixel" x="12" y="5" width="5" height="5" />
      </svg>
    </a>
  </body>
</html>
